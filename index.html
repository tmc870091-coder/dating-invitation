<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6c8d8">
  <title>您的專屬邀請 💌</title>
  <style>
    :root {
      --ink: #593d59;
      --muted: #8f718c;
      --rose: #e86791;
      --rose-dark: #c94d78;
      --lavender: #a78ddd;
      --cream: #fffafc;
      --line: rgba(208, 139, 174, .22);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 18px 42px;
      overflow-x: hidden;
      color: var(--ink);
      font-family: "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      background:
        radial-gradient(circle at 14% 12%, rgba(255,255,255,.8) 0 2px, transparent 3px),
        radial-gradient(circle at 82% 30%, rgba(255,255,255,.7) 0 2px, transparent 3px),
        linear-gradient(130deg, #eee5ff 0%, #f8d9e8 48%, #ffd8d5 100%);
      background-size: 180px 180px, 240px 240px, auto;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .ambient {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .ambient::before,
    .ambient::after {
      content: "";
      position: absolute;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      filter: blur(5px);
      opacity: .3;
      animation: drift 12s ease-in-out infinite alternate;
    }

    .ambient::before { top: -150px; left: -100px; background: #fff; }
    .ambient::after { right: -120px; bottom: -120px; background: #dfb7ff; animation-delay: -4s; }

    .petal {
      position: absolute;
      color: rgba(255, 255, 255, .9);
      font-size: clamp(20px, 3vw, 36px);
      text-shadow: 0 5px 16px rgba(203, 103, 150, .25);
      animation: petalFloat var(--duration, 8s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    .petal:nth-child(1) { top: 8%; left: 9%; }
    .petal:nth-child(2) { top: 14%; right: 14%; }
    .petal:nth-child(3) { top: 46%; left: 4%; }
    .petal:nth-child(4) { top: 62%; right: 7%; }
    .petal:nth-child(5) { bottom: 11%; left: 17%; }
    .petal:nth-child(6) { bottom: 6%; right: 23%; }

    .page {
      position: relative;
      z-index: 1;
      width: min(100%, 760px);
      margin: auto;
    }

    .hero {
      margin-bottom: 18px;
      color: #704a72;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      color: var(--rose-dark);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .18em;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(1.6rem, 4vw, 2.3rem);
      letter-spacing: .04em;
    }

    .hero p { margin: 8px 0 0; color: var(--muted); font-size: .95rem; }

    .card {
      position: relative;
      min-height: 430px;
      padding: clamp(28px, 6vw, 52px);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.85);
      border-radius: 36px;
      background: rgba(255,255,255,.68);
      box-shadow: 0 28px 70px rgba(150, 93, 137, .2), inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .card::before {
      content: "✦";
      position: absolute;
      top: 20px;
      right: 30px;
      color: rgba(232, 103, 145, .35);
      font-size: 1.5rem;
    }

    .progress {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 32px;
    }

    .progress i {
      width: 28px;
      height: 6px;
      border-radius: 20px;
      background: rgba(167,141,221,.2);
      transition: .35s ease;
    }

    .progress i.active { width: 48px; background: linear-gradient(90deg, var(--lavender), var(--rose)); }

    .step { display: none; animation: reveal .5s ease both; }
    .step.active { display: block; }

    .step-heading { margin-bottom: 26px; text-align: center; }
    .step-heading .number { color: var(--rose); font-size: .78rem; font-weight: 800; letter-spacing: .16em; }
    h2 { margin: 8px 0 0; font-size: clamp(1.55rem, 4vw, 2.05rem); letter-spacing: .03em; }
    .hint { margin: 9px 0 0; color: var(--muted); font-size: .92rem; }

    .button-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      min-height: 110px;
      margin-top: 18px;
    }

    .btn {
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 800;
      transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
    }

    .btn:focus-visible, .option:focus-visible, .date-input:focus-visible {
      outline: 3px solid rgba(232,103,145,.35);
      outline-offset: 3px;
    }

    .btn-primary {
      padding: 14px 28px;
      color: #fff;
      background: linear-gradient(135deg, #f18aa9, #da5b89);
      box-shadow: 0 12px 24px rgba(216, 91, 137, .28);
    }

    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 15px 28px rgba(216,91,137,.35); }

    .btn-secondary {
      padding: 13px 25px;
      color: #856d88;
      background: rgba(255,255,255,.82);
      box-shadow: 0 9px 20px rgba(120,85,125,.12);
    }

    .btn-no { position: relative; z-index: 2; }
    .btn-wide { display: block; width: min(100%, 330px); margin: 24px auto 0; }

    .date-wrap { max-width: 360px; margin: 0 auto; text-align: center; }
    .date-label { display: block; margin-bottom: 9px; color: var(--muted); font-size: .82rem; font-weight: 700; }
    .date-input {
      width: 100%;
      padding: 15px 18px;
      border: 1.5px solid var(--line);
      border-radius: 18px;
      color: var(--ink);
      background: rgba(255,255,255,.86);
      box-shadow: 0 8px 22px rgba(128,87,130,.08);
      text-align: center;
      cursor: pointer;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 480px;
      margin: 0 auto;
    }

    .option {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 76px;
      padding: 12px;
      border: 1.5px solid rgba(224, 174, 203, .32);
      border-radius: 20px;
      color: #7a607a;
      background: rgba(255,255,255,.7);
      cursor: pointer;
      font-weight: 700;
      transition: .25s ease;
    }

    .option:hover { transform: translateY(-3px); border-color: #e894b2; }
    .option.selected { color: var(--rose-dark); border-color: var(--rose); background: #fff1f6; box-shadow: 0 9px 20px rgba(232,103,145,.16); }
    .option .emoji { margin-right: 8px; font-size: 1.35rem; }

    .letter {
      position: relative;
      max-width: 560px;
      margin: auto;
      padding: 25px 24px;
      border: 1px solid rgba(234, 157, 186, .28);
      border-radius: 24px;
      color: #704f69;
      background: linear-gradient(135deg, rgba(255,248,251,.88), rgba(255,239,246,.74));
      line-height: 1.9;
      text-align: left;
    }

    .letter::after { content: "♡"; position: absolute; right: 20px; bottom: 9px; color: rgba(232,103,145,.35); font-size: 2.6rem; }
    .letter strong { color: var(--rose-dark); }

    .records {
      margin-top: 22px;
      padding: 21px;
      border: 1px solid rgba(255,255,255,.75);
      border-radius: 28px;
      background: rgba(255,255,255,.58);
      box-shadow: 0 17px 36px rgba(150,93,137,.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .records-title { margin: 0 0 14px; color: #704a72; font-size: 1.05rem; text-align: center; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; min-width: 560px; border-collapse: collapse; font-size: .9rem; text-align: left; }
    th, td { padding: 11px 10px; border-bottom: 1px solid rgba(203,146,177,.18); }
    th { color: #92617f; font-size: .78rem; letter-spacing: .08em; }
    td { color: #765e75; }
    tbody tr:last-child td { border-bottom: 0; }
    .empty { padding: 20px 10px; color: #aa90a7; text-align: center; }
    .delete-button {
      padding: 7px 12px;
      border: 1px solid rgba(201, 77, 120, .28);
      border-radius: 999px;
      color: var(--rose-dark);
      background: rgba(255, 241, 246, .8);
      cursor: pointer;
      font-size: .8rem;
      font-weight: 700;
    }
    .delete-button:hover { background: #fff1f6; }
    .secret-button {
      padding: 7px 12px;
      border: 1px solid rgba(167, 141, 221, .35);
      border-radius: 999px;
      color: #765e9a;
      background: rgba(245, 240, 255, .86);
      cursor: pointer;
      font-size: .8rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .secret-button:hover { background: #eee7ff; }

    @keyframes reveal { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes drift { to { transform: translate(35px, 25px) scale(1.08); } }
    @keyframes petalFloat { 0%,100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-20px) rotate(12deg); } }

    @media (max-width: 520px) {
      body { padding: 22px 12px 30px; }
      .hero { margin-bottom: 12px; }
      .card { min-height: 420px; padding: 25px 17px; border-radius: 28px; }
      .button-row { gap: 12px; }
      .btn-primary, .btn-secondary { padding: 12px 21px; }
      .records { padding: 17px 12px; border-radius: 22px; }
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="petal" style="--duration: 7s;">🌸</span>
    <span class="petal" style="--duration: 9s; --delay: -2s;">✦</span>
    <span class="petal" style="--duration: 8s; --delay: -4s;">🌷</span>
    <span class="petal" style="--duration: 10s; --delay: -1s;">♡</span>
    <span class="petal" style="--duration: 8s; --delay: -5s;">🌸</span>
    <span class="petal" style="--duration: 9s; --delay: -3s;">✧</span>
  </div>

  <main class="page">
    <header class="hero">
      <div class="eyebrow">FOR YOU · WITH LOVE</div>
      <h1>一份只屬於我們的邀請 💌</h1>
      <p>把今天的心動，收藏成明天的回憶。</p>
    </header>

    <section class="card" aria-live="polite">
      <div class="progress" aria-label="目前進度">
        <i class="active"></i><i></i><i></i><i></i>
      </div>

      <div class="step active" id="step1">
        <div class="step-heading">
          <div class="number">STEP 01 · THE INVITATION</div>
          <h2>要不要跟我去約會？ 🥺</h2>
        </div>
        <div class="button-row" id="escapeZone">
          <button class="btn btn-primary" id="yesButton" type="button">好哦 ♥</button>
          <button class="btn btn-secondary btn-no" id="noButton" type="button">No</button>
        </div>
      </div>

      <div class="step" id="step2">
        <div class="step-heading">
          <div class="number">STEP 02 · PICK A DAY</div>
          <h2>挑一個心動的日子吧 🗓️</h2>
          <p class="hint">未來的每一天，都值得和你一起期待。</p>
        </div>
        <div class="date-wrap">
          <label class="date-label" for="dateInput">我們的約會日期</label>
          <input class="date-input" id="dateInput" type="date">
        </div>
        <button class="btn btn-primary btn-wide" id="dateButton" type="button">就這天！ ✨</button>
      </div>

      <div class="step" id="step3">
        <div class="step-heading">
          <div class="number">STEP 03 · MAKE A PLAN</div>
          <h2>想一起做些什麼呢？ 🍓</h2>
          <p class="hint">可以複選，心動的行程當然都要。</p>
        </div>
        <div class="options-grid" id="optionsGrid">
          <button class="option" type="button" data-plan="逛街"><span class="emoji">🛍️</span>逛街</button>
          <button class="option" type="button" data-plan="吃飯"><span class="emoji">🍰</span>吃飯</button>
          <button class="option" type="button" data-plan="夜市"><span class="emoji">🏮</span>夜市</button>
          <button class="option" type="button" data-plan="看風景"><span class="emoji">🌅</span>看風景</button>
          <button class="option" type="button" data-plan="看電影"><span class="emoji">🎬</span>看電影</button>
        </div>
        <button class="btn btn-secondary btn-wide" id="allButton" type="button">都要 ♥</button>
        <button class="btn btn-primary btn-wide" id="submitButton" type="button">把計畫交給你 💌</button>
      </div>

      <div class="step" id="step4">
        <div class="step-heading">
          <div class="number">STEP 04 · A LETTER FOR YOU</div>
          <h2>給你的一封浪漫情書 💌</h2>
        </div>
        <div class="letter" id="letterContent"></div>
        <button class="btn btn-primary btn-wide" id="resetButton" type="button">再看一次 ♡</button>
      </div>
    </section>

    <section class="records">
      <h2 class="records-title">📊 完美約會計畫紀錄表</h2>
      <div class="table-scroll">
        <table>
          <thead><tr><th>次數</th><th>預定日期</th><th>行程安排</th><th>悄悄話</th><th>管理</th></tr></thead>
          <tbody id="recordBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const plans = ["逛街", "吃飯", "夜市", "看風景", "看電影"];
      const steps = [...document.querySelectorAll(".step")];
      const progress = [...document.querySelectorAll(".progress i")];
      const noButton = document.getElementById("noButton");
      const yesButton = document.getElementById("yesButton");
      const escapeZone = document.getElementById("escapeZone");
      const dateInput = document.getElementById("dateInput");
      const recordBody = document.getElementById("recordBody");
      let currentStep = 1;
      let yesScale = 1;
      let selectedDate = "";
      let selectedPlans = [];
      let noMoves = 0;

      const today = new Date();
      const localDate = new Date(today.getTime() - today.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
      const tomorrow = new Date(today);
      tomorrow.setDate(today.getDate() + 1);
      const tomorrowLocal = new Date(tomorrow.getTime() - tomorrow.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
      dateInput.min = localDate;
      dateInput.value = tomorrowLocal;

      const getRecords = () => JSON.parse(localStorage.getItem("perfectDatePlans") || "[]");

      function renderRecords() {
        const records = getRecords();
        recordBody.innerHTML = records.length
          ? records.map((record, index) => `<tr><td>${index + 1}</td><td>${record.date}</td><td>${record.plans.join("、")}</td><td><button class="secret-button" type="button" data-record-index="${index}">🔒 點擊查看</button></td><td><button class="delete-button" type="button" data-record-index="${index}">刪除</button></td></tr>`).join("")
          : '<tr><td class="empty" colspan="5">還沒有紀錄，等你來寫下第一個約會計畫 ♡</td></tr>';
      }

      function showStep(step) {
        currentStep = step;
        steps.forEach((item, index) => item.classList.toggle("active", index + 1 === step));
        progress.forEach((item, index) => item.classList.toggle("active", index + 1 <= step));
      }

      function moveNoButton() {
        noMoves += 1;
        yesScale = Math.min(1.7, yesScale + .12);
        yesButton.style.transform = `scale(${yesScale})`;
        const maxX = Math.max(38, Math.min(92, escapeZone.clientWidth / 4));
        const maxY = 28;
        const x = (Math.random() * 2 - 1) * maxX;
        const y = (Math.random() * 2 - 1) * maxY;
        noButton.style.transform = `translate(${x}px, ${y}px)`;
      }

      function selectPlan(button) {
        const plan = button.dataset.plan;
        button.classList.toggle("selected");
        selectedPlans = [...document.querySelectorAll(".option.selected")].map(item => item.dataset.plan);
        document.getElementById("allButton").classList.toggle("selected", selectedPlans.length === plans.length);
      }

      function savePlan() {
        if (!selectedPlans.length) {
          alert("挑一個你想做的事情嘛 🥺");
          return;
        }
        const records = getRecords();
        records.push({ date: selectedDate, plans: [...selectedPlans], noMoves });
        localStorage.setItem("perfectDatePlans", JSON.stringify(records));
        renderRecords();
        document.getElementById("letterContent").innerHTML =
          `親愛的：<br><br>太開心了！我們把 <strong>${selectedDate}</strong> 留給彼此，一起去 <strong>${selectedPlans.join("、")}</strong>。<br><br>只要和你在一起，平凡的一天也會變成我最期待的浪漫。謝謝你答應我，這天不見不散喔！♡`;
        showStep(4);
      }

      noButton.addEventListener("mouseenter", moveNoButton);
      noButton.addEventListener("focus", moveNoButton);
      noButton.addEventListener("click", event => { event.preventDefault(); moveNoButton(); });
      yesButton.addEventListener("click", () => showStep(2));
      document.getElementById("dateButton").addEventListener("click", () => {
        if (!dateInput.value || dateInput.value < dateInput.min) {
          alert("請選擇今天或之後的浪漫日子吧！");
          return;
        }
        selectedDate = dateInput.value;
        showStep(3);
      });
      document.querySelectorAll(".option").forEach(button => button.addEventListener("click", () => selectPlan(button)));
      document.getElementById("allButton").addEventListener("click", event => {
        const selectAll = selectedPlans.length !== plans.length;
        document.querySelectorAll(".option").forEach(button => button.classList.toggle("selected", selectAll));
        selectedPlans = selectAll ? [...plans] : [];
        event.currentTarget.classList.toggle("selected", selectAll);
      });
      document.getElementById("submitButton").addEventListener("click", savePlan);
      recordBody.addEventListener("click", event => {
        const secretButton = event.target.closest(".secret-button");
        if (secretButton) {
          const password = prompt("請輸入悄悄話密碼：");
          if (password === "5200") {
            const record = getRecords()[Number(secretButton.dataset.recordIndex)];
            secretButton.textContent = `${record.noMoves || 0} 次`;
            secretButton.disabled = true;
          }
          return;
        }
        const deleteButton = event.target.closest(".delete-button");
        if (!deleteButton) return;
        const password = prompt("請輸入刪除密碼：");
        if (password !== "5200") {
          alert("密碼錯誤，紀錄未刪除。");
          return;
        }
        const records = getRecords();
        records.splice(Number(deleteButton.dataset.recordIndex), 1);
        localStorage.setItem("perfectDatePlans", JSON.stringify(records));
        renderRecords();
      });
      document.getElementById("resetButton").addEventListener("click", () => {
        yesScale = 1;
        noMoves = 0;
        selectedPlans = [];
        noButton.style.transform = "translate(0, 0)";
        yesButton.style.transform = "scale(1)";
        document.querySelectorAll(".option, #allButton").forEach(item => item.classList.remove("selected"));
        showStep(1);
      });

      window.addEventListener("storage", renderRecords);
      renderRecords();
    })();
  </script>
</body>
</html>
